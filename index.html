<html lang="en">
<head>

  <title>Minesweeper</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@500;600;700&display=swap');

    @media(prefers-color-scheme:dark){:root{--page:#161815;--grid:rgba(255,255,255,.035);--panel:#767973;--hi:#bfc1bb;--lo:#41433f;--deep:#20211f;--ink:#f4f5ef;--muted:#c1c5bd;--screen:#0d0908;--led:#ff6249;--open:#9a9d96;--mine:#11120f;--focus:#69b8ff;--danger:#ff7272;--shadow:rgba(0,0,0,.42);--n1:#083fa7;--n2:#155f31;--n3:#ad2020;--n4:#35227f;--n5:#771818;--n6:#006969;--n7:#151515;--n8:#555}}
    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;min-height:100svh;padding:max(18px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:grid;place-items:start center;font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--ink);background-color:var(--page);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;-webkit-tap-highlight-color:transparent}
    main{width:min(100%,790px);display:grid;gap:14px}.home-bar{display:flex;justify-content:flex-start}.home-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-top:3px solid var(--hi);border-left:3px solid var(--hi);border-right:3px solid var(--deep);border-bottom:3px solid var(--deep);background:var(--panel);color:var(--ink);font:700 13px/1 "IBM Plex Sans",sans-serif;text-decoration:none;box-shadow:0 2px 6px var(--shadow)}.home-pill:active{border-color:var(--deep) var(--hi) var(--hi) var(--deep)}.difficulty{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(100%,520px);margin:0 auto;padding:5px;background:color-mix(in srgb,var(--page),var(--ink) 8%);border:1px solid color-mix(in srgb,var(--muted),transparent 45%);border-radius:8px}.difficulty button{appearance:none;border:0;border-radius:5px;min-height:42px;padding:7px 4px 6px;font:700 clamp(12px,3vw,14px)/1.05 "IBM Plex Sans",sans-serif;color:var(--muted);background:transparent;cursor:pointer}.difficulty button small{display:block;margin-top:4px;font:600 10px/1 "IBM Plex Mono",monospace;opacity:.8}.difficulty button[aria-pressed="true"]{background:var(--deep);color:#fff;box-shadow:0 1px 3px var(--shadow)}
    button:focus-visible{outline:3px solid var(--focus);outline-offset:2px;position:relative;z-index:5}.machine{width:100%;padding:clamp(10px,2.5vw,18px);background:var(--panel);border-top:5px solid var(--hi);border-left:5px solid var(--hi);border-right:5px solid var(--deep);border-bottom:5px solid var(--deep);box-shadow:0 12px 30px var(--shadow);user-select:none;touch-action:manipulation}.dashboard{min-height:74px;padding:10px clamp(10px,3vw,18px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;border-top:4px solid var(--lo);border-left:4px solid var(--lo);border-right:4px solid var(--hi);border-bottom:4px solid var(--hi);margin-bottom:clamp(10px,2.5vw,18px)}.meter{min-width:0}.meter:last-child{text-align:right}.meter-label{display:block;margin-bottom:4px;font:700 9px/1 "IBM Plex Sans",sans-serif;letter-spacing:.13em;text-transform:uppercase;color:color-mix(in srgb,var(--ink),transparent 25%)}.display{display:inline-grid;place-items:center;min-width:clamp(66px,18vw,88px);height:38px;padding:0 8px;border:3px inset var(--lo);background:var(--screen);color:var(--led);text-shadow:0 0 8px color-mix(in srgb,var(--led),transparent 45%);font:700 clamp(22px,6vw,28px)/1 "IBM Plex Mono",monospace;letter-spacing:.04em;font-variant-numeric:tabular-nums}
    .restart{appearance:none;width:52px;height:52px;padding:0 0 4px;border:0;border-top:4px solid var(--hi);border-left:4px solid var(--hi);border-right:4px solid var(--deep);border-bottom:4px solid var(--deep);background:var(--panel);color:#171916;font:700 21px/1 "IBM Plex Mono",monospace;cursor:pointer}.restart:active{border-color:var(--deep) var(--hi) var(--hi) var(--deep);padding:3px 0 1px 3px}.board-wrap{position:relative;width:100%;border-top:5px solid var(--lo);border-left:5px solid var(--lo);border-right:5px solid var(--hi);border-bottom:5px solid var(--hi);background:var(--lo);overflow:hidden}.board{width:100%;display:grid;gap:1px;background:var(--lo)}
    .cell{appearance:none;position:relative;min-width:0;aspect-ratio:1;padding:0;border:0;background:var(--panel);color:var(--ink);font:700 clamp(8px,var(--digit-size,19px),20px)/1 "IBM Plex Mono",monospace;display:grid;place-items:center;cursor:pointer;border-top:clamp(1px,var(--bevel,3px),3px) solid var(--hi);border-left:clamp(1px,var(--bevel,3px),3px) solid var(--hi);border-right:clamp(1px,var(--bevel,3px),3px) solid var(--deep);border-bottom:clamp(1px,var(--bevel,3px),3px) solid var(--deep)}.cell.revealed,.cell.wrong{background:var(--open);border:0;cursor:default}.cell.revealed::after,.cell.wrong::after{content:"";position:absolute;inset:0;border:1px solid color-mix(in srgb,var(--lo),transparent 45%);pointer-events:none}.cell.flagged::before{content:"";width:46%;height:48%;background:var(--danger);clip-path:polygon(12% 0,100% 27%,12% 58%,12% 100%,0 100%,0 0);filter:drop-shadow(1px 1px 0 rgba(0,0,0,.35))}.cell.flagged::after{content:"";position:absolute;width:48%;height:9%;left:25%;bottom:20%;background:var(--mine)}.cell.mine.revealed::before,.cell.exploded::before{content:"";width:56%;height:56%;border-radius:50%;background:var(--mine);box-shadow:0 -6px 0 -4px var(--mine),0 6px 0 -4px var(--mine),6px 0 0 -4px var(--mine),-6px 0 0 -4px var(--mine),4px 4px 0 -4px var(--mine),-4px -4px 0 -4px var(--mine),4px -4px 0 -4px var(--mine),-4px 4px 0 -4px var(--mine)}.cell.exploded{background:#e74b40;border:0}.cell.wrong::before,.cell.wrong::after{content:"";position:absolute;width:70%;height:11%;top:44%;left:15%;background:var(--danger);transform:rotate(45deg);border:0}.cell.wrong::after{transform:rotate(-45deg)}
    .n1{color:var(--n1)}.n2{color:var(--n2)}.n3{color:var(--n3)}.n4{color:var(--n4)}.n5{color:var(--n5)}.n6{color:var(--n6)}.n7{color:var(--n7)}.n8{color:var(--n8)}.result{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:color-mix(in srgb,var(--page),transparent 18%);backdrop-filter:blur(2px);z-index:10}.result[hidden]{display:none}.result-card{width:min(320px,92%);padding:22px 18px;text-align:center;background:var(--panel);border-top:4px solid var(--hi);border-left:4px solid var(--hi);border-right:4px solid var(--deep);border-bottom:4px solid var(--deep);box-shadow:0 12px 28px var(--shadow)}.result-card strong{display:block;font:700 clamp(24px,8vw,34px)/1 "IBM Plex Mono",monospace;margin-bottom:8px}.result-card p{margin:0 0 16px;color:var(--muted);font-weight:600}.result-card button{appearance:none;border:2px solid var(--deep);border-radius:4px;padding:10px 18px;background:var(--deep);color:#fff;font:700 14px/1 "IBM Plex Sans",sans-serif;cursor:pointer}.hint{margin:0 auto;max-width:620px;text-align:center;color:var(--muted);font:600 clamp(12px,3.5vw,14px)/1.55 "IBM Plex Sans",sans-serif}.hint kbd{padding:2px 5px;border:1px solid color-mix(in srgb,var(--muted),transparent 35%);border-bottom-width:2px;border-radius:3px;background:color-mix(in srgb,var(--page),var(--ink) 5%);font:600 .88em "IBM Plex Mono",monospace}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    @media(max-width:520px){body{padding-left:8px;padding-right:8px}main{gap:10px}.machine{border-width:4px;padding:8px}.dashboard{min-height:66px;gap:7px;padding:7px;margin-bottom:8px;border-width:3px}.restart{width:46px;height:46px;font-size:18px;border-width:3px}.display{min-width:64px;height:34px;padding:0 5px}.board-wrap{border-width:3px}.difficulty button{min-height:40px}}
  </style>
</head>
<body>
  <main aria-label="Minesweeper game">
    <div class="home-bar"><a class="home-pill" href="https://jesuslovestyler.com/">⌂ Home</a></div>
    <nav class="difficulty" aria-label="Choose difficulty">
      <button type="button" data-level="beginner" aria-pressed="true">Beginner<small>9 × 9 · 10</small></button>
      <button type="button" data-level="intermediate" aria-pressed="false">Intermediate<small>16 × 16 · 40</small></button>
      <button type="button" data-level="expert" aria-pressed="false">Expert<small>30 × 16 · 99</small></button>
    </nav>
    <section class="machine" aria-label="Game board">
      <div class="dashboard">
        <div class="meter"><span class="meter-label">Mines</span><span class="display" id="mineCount" aria-live="polite">010</span></div>
        <button class="restart" id="restart" type="button" aria-label="Restart game">:)</button>
        <div class="meter"><span class="meter-label">Time</span><span class="display" id="timer">000</span></div>
      </div>
      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="Beginner Minesweeper board"></div>
        <div class="result" id="result" hidden><div class="result-card" role="status"><strong id="resultTitle">Cleared!</strong><p id="resultText"></p><button type="button" id="playAgain">Play again</button></div></div>
      </div>
    </section>
    <p class="hint">Tap a square to reveal it. Long-press to place a flag. On desktop, use <kbd>right-click</kbd> to flag.</p>
    <div class="sr-only" id="announcement" aria-live="assertive"></div>
  </main>
  <script>
    (function(){"use strict";
      var levels={beginner:{rows:9,cols:9,mines:10,label:"Beginner"},intermediate:{rows:16,cols:16,mines:40,label:"Intermediate"},expert:{rows:16,cols:30,mines:99,label:"Expert"}};
      var boardEl=document.getElementById("board"),mineCountEl=document.getElementById("mineCount"),timerEl=document.getElementById("timer"),restartEl=document.getElementById("restart"),resultEl=document.getElementById("result"),resultTitleEl=document.getElementById("resultTitle"),resultTextEl=document.getElementById("resultText"),playAgainEl=document.getElementById("playAgain"),announcementEl=document.getElementById("announcement"),difficultyButtons=Array.prototype.slice.call(document.querySelectorAll("[data-level]"));
      var currentLevel="beginner",config=levels[currentLevel],cells=[],started=false,ended=false,flags=0,revealed=0,seconds=0,timerId=null,longPressTimer=null,longPressTriggered=false,pointerStart=null;
      function displayNumber(v){return v<0?"-"+String(Math.min(99,Math.abs(v))).padStart(2,"0"):String(Math.min(999,v)).padStart(3,"0")}
      function indexOf(r,c){return r*config.cols+c}
      function neighbors(index){var cell=cells[index],list=[];for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){if(dr===0&&dc===0)continue;var r=cell.row+dr,c=cell.col+dc;if(r>=0&&r<config.rows&&c>=0&&c<config.cols)list.push(indexOf(r,c))}return list}
      function resetGame(){stopTimer();started=false;ended=false;flags=0;revealed=0;seconds=0;restartEl.textContent=":)";resultEl.hidden=true;timerEl.textContent="000";mineCountEl.textContent=displayNumber(config.mines);boardEl.innerHTML="";boardEl.style.gridTemplateColumns="repeat("+config.cols+",minmax(0,1fr))";boardEl.style.setProperty("--digit-size",config.cols>=30?"11px":config.cols>=16?"15px":"20px");boardEl.style.setProperty("--bevel",config.cols>=30?"1px":config.cols>=16?"2px":"3px");boardEl.setAttribute("aria-label",config.label+" Minesweeper board, "+config.rows+" rows by "+config.cols+" columns");cells=[];for(var r=0;r<config.rows;r++)for(var c=0;c<config.cols;c++){var button=document.createElement("button");button.type="button";button.className="cell";button.setAttribute("role","gridcell");button.setAttribute("aria-label","Hidden square, row "+(r+1)+", column "+(c+1));button.dataset.index=String(cells.length);boardEl.appendChild(button);cells.push({row:r,col:c,mine:false,count:0,revealed:false,flagged:false,el:button})}}
      function placeMines(firstIndex){var safe=new Set(neighbors(firstIndex).concat([firstIndex])),candidates=[];for(var i=0;i<cells.length;i++)if(!safe.has(i))candidates.push(i);for(var j=candidates.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),tmp=candidates[j];candidates[j]=candidates[k];candidates[k]=tmp}for(var m=0;m<config.mines;m++)cells[candidates[m]].mine=true;cells.forEach(function(cell,idx){if(!cell.mine)cell.count=neighbors(idx).filter(function(n){return cells[n].mine}).length})}
      function startTimer(){timerId=window.setInterval(function(){seconds=Math.min(999,seconds+1);timerEl.textContent=displayNumber(seconds);if(seconds===999)stopTimer()},1000)}function stopTimer(){if(timerId!==null)window.clearInterval(timerId);timerId=null}function ensureStarted(index){if(started)return;started=true;placeMines(index);startTimer()}
      function reveal(index){if(ended)return;var cell=cells[index];if(!cell||cell.revealed||cell.flagged)return;ensureStarted(index);if(cell.mine){cell.revealed=true;cell.el.classList.add("exploded");finish(false);return}floodReveal(index);checkWin()}
      function floodReveal(startIndex){var queue=[startIndex],seen=new Set();while(queue.length){var index=queue.shift();if(seen.has(index))continue;seen.add(index);var cell=cells[index];if(cell.revealed||cell.flagged||cell.mine)continue;cell.revealed=true;revealed++;cell.el.classList.add("revealed");cell.el.disabled=true;if(cell.count>0){cell.el.textContent=String(cell.count);cell.el.classList.add("n"+cell.count);cell.el.setAttribute("aria-label",cell.count+" adjacent "+(cell.count===1?"mine":"mines"))}else{cell.el.setAttribute("aria-label","Empty revealed square");neighbors(index).forEach(function(n){if(!cells[n].revealed&&!cells[n].flagged)queue.push(n)})}}}
      function chord(index){if(ended||!started)return;var cell=cells[index];if(!cell.revealed||cell.count===0)return;var near=neighbors(index),nearFlags=near.filter(function(n){return cells[n].flagged}).length;if(nearFlags!==cell.count)return;for(var i=0;i<near.length;i++)if(!cells[near[i]].flagged&&!cells[near[i]].revealed){if(cells[near[i]].mine){cells[near[i]].el.classList.add("exploded");finish(false);return}floodReveal(near[i])}checkWin()}
      function toggleFlag(index){if(ended)return;var cell=cells[index];if(!cell||cell.revealed)return;cell.flagged=!cell.flagged;flags+=cell.flagged?1:-1;cell.el.classList.toggle("flagged",cell.flagged);cell.el.setAttribute("aria-label",(cell.flagged?"Flagged":"Hidden")+" square, row "+(cell.row+1)+", column "+(cell.col+1));mineCountEl.textContent=displayNumber(config.mines-flags);announcementEl.textContent=cell.flagged?"Flag placed":"Flag removed"}
      function checkWin(){if(revealed===cells.length-config.mines)finish(true)}
      function finish(won){ended=true;stopTimer();restartEl.textContent=won?"B)":"X(";cells.forEach(function(cell){if(cell.mine&&!cell.flagged)cell.el.classList.add("mine","revealed");if(!cell.mine&&cell.flagged)cell.el.classList.add("wrong");cell.el.disabled=true});if(won){cells.forEach(function(cell){if(cell.mine&&!cell.flagged){cell.flagged=true;cell.el.classList.add("flagged")}});mineCountEl.textContent="000";resultTitleEl.textContent="Field cleared!";resultTextEl.textContent="You found every safe square in "+seconds+(seconds===1?" second.":" seconds.");announcementEl.textContent="You won Minesweeper in "+seconds+" seconds."}else{resultTitleEl.textContent="Mine hit";resultTextEl.textContent="The field got you at "+seconds+(seconds===1?" second.":" seconds.");announcementEl.textContent="Game over. You hit a mine."}window.setTimeout(function(){resultEl.hidden=false;playAgainEl.focus()},380)}
      boardEl.addEventListener("click",function(event){var target=event.target.closest(".cell");if(!target||longPressTriggered){longPressTriggered=false;return}var index=Number(target.dataset.index);if(cells[index].revealed)chord(index);else reveal(index)});boardEl.addEventListener("contextmenu",function(event){var target=event.target.closest(".cell");if(!target)return;event.preventDefault();toggleFlag(Number(target.dataset.index))});
      boardEl.addEventListener("pointerdown",function(event){var target=event.target.closest(".cell");if(!target||event.pointerType==="mouse")return;longPressTriggered=false;pointerStart={x:event.clientX,y:event.clientY};longPressTimer=window.setTimeout(function(){longPressTriggered=true;toggleFlag(Number(target.dataset.index));if(navigator.vibrate)navigator.vibrate(35)},520)});boardEl.addEventListener("pointermove",function(event){if(!pointerStart||!longPressTimer)return;if(Math.abs(event.clientX-pointerStart.x)>10||Math.abs(event.clientY-pointerStart.y)>10){window.clearTimeout(longPressTimer);longPressTimer=null}});function clearPress(){if(longPressTimer)window.clearTimeout(longPressTimer);longPressTimer=null;pointerStart=null}boardEl.addEventListener("pointerup",clearPress);boardEl.addEventListener("pointercancel",clearPress);boardEl.addEventListener("pointerleave",clearPress);
      difficultyButtons.forEach(function(button){button.addEventListener("click",function(){currentLevel=button.dataset.level;config=levels[currentLevel];difficultyButtons.forEach(function(b){b.setAttribute("aria-pressed",String(b===button))});resetGame()})});restartEl.addEventListener("click",resetGame);playAgainEl.addEventListener("click",resetGame);resetGame();
    })();
  </script>
  <script data-goatcounter="https://jesuslovestyler.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
